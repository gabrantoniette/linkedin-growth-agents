[project]
name = "linkedin-growth"
version = "0.1.0"
description = "Sistema multiagente (Agno) para construir relevância no LinkedIn em engenharia de IA"
readme = "README.md"
authors = [
    { name = "Gabriel Antoniette", email = "gabeantoniette@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=3.0.0",
    "anthropic>=1.3.0",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
linkedin = "linkedin_growth.cli:app"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
