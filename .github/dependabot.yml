version: 2

# Every ecosystem waits seven days before proposing a release, so a
# compromised version has time to be caught and pulled before it gets here.
# Minor and patch bumps come grouped, one pull request per ecosystem, and
# majors one at a time, because a major is where something actually breaks.
#
# Security updates are a separate switch, on in the repository settings. They
# ignore the cooldown and the schedule and open as soon as an alert does.

updates:
  # Python: pyproject.toml and uv.lock. The tests workflow installs with
  # `uv sync --locked`, so a bump that leaves the lockfile behind fails there.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # agent_ui: pnpm-lock.yaml is the lockfile in use (CI and the README both
  # install with pnpm). The package-lock.json beside it is older and unused.
  - package-ecosystem: npm
    directory: /agent_ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      agent-ui-minor-and-patch:
        update-types: [minor, patch]

  # The actions used by the workflows themselves
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
