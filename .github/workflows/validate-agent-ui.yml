name: Validate agent_ui

# Moved here from `agent_ui/.github/workflows/validate.yml`, where it had never
# run once: GitHub Actions only reads workflows from `.github/workflows/` at the
# repository root, and that copy sat one directory down. It arrived with the
# vendored `agent_ui` template, which was its own repository at the time, so the
# path was right there and wrong here.
#
# Worth knowing because it was actively misleading: the file looked like a CI
# gate, so the `prettier --check` inside it looked enforced, and it was not.
on:
  push:

jobs:
  validate:
    name: lint, format, typecheck
    runs-on: ubuntu-latest

    # The whole job runs inside `agent_ui`. Every path in the scripts is relative
    # to that directory, which is what the file assumed when it lived there.
    defaults:
      run:
        working-directory: agent_ui

    steps:
      - uses: actions/checkout@v4

      # pnpm before Node, so `cache: pnpm` below has a store to point at.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to the version that generated the committed lockfile, which is
          # what a frozen install requires.
          #
          # The original file said 10.14.0 and that fails here:
          # `ERR_PNPM_LOCKFILE_CONFIG_MISMATCH`. pnpm 10 reads the
          # `pnpm.overrides` field in `package.json` and expects the lockfile to
          # record the same overrides; this lockfile records none, because it was
          # written by pnpm 11, which stopped reading that field. Raising the pin
          # is the fix, not lowering the lockfile.
          #
          # Side effect worth knowing, and NOT fixed here: that means the
          # `picomatch: ">=2.3.2"` override in `package.json` is inert. pnpm 11
          # wants overrides in `pnpm-workspace.yaml`, and they are not there. The
          # lockfile resolves `picomatch@2.3.2` anyway, but by the dependency
          # tree's own choice rather than because anything pins it.
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Floor set by pnpm, not by taste: pnpm 11.25 declares
          # `engines: { node: ">=22.13" }` and reaches for `node:sqlite`, which
          # does not exist before Node 22. Pinning 20 here failed with
          # `ERR_UNKNOWN_BUILTIN_MODULE: No such built-in module: node:sqlite`
          # inside the pnpm setup step.
          #
          # 22 rather than the 26 a developer may have locally, on purpose: this
          # project declares no `engines`, so CI is where the supported floor is
          # decided, and testing the floor catches a Node 26 API sneaking into the
          # code. Anything that passes on 22 passes on 26.
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent_ui/pnpm-lock.yaml

      - name: Install dependencies
        # pnpm defaults to `--frozen-lockfile` when CI is set, so a lockfile that
        # disagrees with `package.json` fails here rather than installing
        # something nobody chose.
        run: pnpm install

      - name: Validate
        # lint && format && typecheck. The `format` step is `prettier --check`,
        # which is why `.gitattributes` had to declare LF: without it a Windows
        # checkout hands Prettier CRLF files and this step fails on 67 files that
        # pass here.
        run: pnpm run validate
