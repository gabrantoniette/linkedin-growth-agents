allowBuilds:
  sharp: true

# Overrides live here as of pnpm 11. They used to live in the `pnpm` field of
# package.json, which pnpm 11 started ignoring with a warning - and the pin below
# went inert because of it, without anything failing.
#
# picomatch < 2.3.2 has a ReDoS. Its dependents (anymatch, micromatch, readdirp)
# declare `^2.x` ranges that accept vulnerable versions; today resolution lands on
# 2.3.2 because it is the last 2.x, not because anything requires it. This
# override is what turns a coincidence into a guarantee.
overrides:
  picomatch: '>=2.3.2'
